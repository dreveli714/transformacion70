<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Transformación 70</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#FBF6EF; --card:#FFFFFF; --texto:#2A2138; --texto2:#7A6F8A;
  --linea:#EFE6DA; --acento:#E85D4A; --acento2:#F2A93B; --exito:#2FA37C;
  --sombra:0 6px 24px rgba(42,33,56,.08); --radio:22px;
  --oro:#F2A93B; --plata:#B8B3C7; --bronce:#C98A5B;
}
[data-theme="dark"]{
  --bg:#1C1526; --card:#2A2138; --texto:#F5EFE6; --texto2:#A99DBD;
  --linea:#3C3150; --sombra:0 6px 24px rgba(0,0,0,.35);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:17px}
body{
  font-family:'Nunito',sans-serif;background:var(--bg);color:var(--texto);
  min-height:100vh;padding-bottom:96px;transition:background .3s,color .3s;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background:radial-gradient(600px 300px at 90% -50px, rgba(232,93,74,.12), transparent),
             radial-gradient(500px 260px at -10% 30%, rgba(242,169,59,.10), transparent);
}
.app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:18px 16px}

/* ---------- Cabecera ---------- */
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.logo{font-family:'Fraunces',serif;font-weight:900;font-size:1.45rem;letter-spacing:-.5px}
.logo span{color:var(--acento)}
.tema-btn{
  border:none;background:var(--card);box-shadow:var(--sombra);width:44px;height:44px;
  border-radius:50%;font-size:1.2rem;cursor:pointer;
}

/* ---------- Tarjetas ---------- */
.card{
  background:var(--card);border-radius:var(--radio);box-shadow:var(--sombra);
  padding:20px;margin-bottom:16px;border:1px solid var(--linea);
  animation:aparecer .5s ease both;
}
@keyframes aparecer{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card:nth-child(2){animation-delay:.06s}.card:nth-child(3){animation-delay:.12s}
.card:nth-child(4){animation-delay:.18s}.card:nth-child(5){animation-delay:.24s}
h2{font-family:'Fraunces',serif;font-size:1.15rem;font-weight:700;margin-bottom:12px}
.sub{color:var(--texto2);font-size:.85rem;font-weight:700}

/* ---------- Inicio: día ---------- */
.dia-grande{text-align:center;padding:26px 20px}
.dia-num{font-family:'Fraunces',serif;font-size:3.6rem;font-weight:900;line-height:1;color:var(--acento)}
.dia-de{font-size:1rem;color:var(--texto2);font-weight:800;margin-top:4px}
.barra-fondo{height:14px;background:var(--linea);border-radius:99px;margin:18px 0 8px;overflow:hidden}
.barra-relleno{
  height:100%;border-radius:99px;transition:width 1.2s cubic-bezier(.2,.8,.2,1);
  background:linear-gradient(90deg,var(--acento2),var(--acento));
}
.mini-datos{display:flex;justify-content:space-around;margin-top:14px}
.mini-dato{text-align:center}
.mini-dato b{display:block;font-size:1.25rem;font-family:'Fraunces',serif}
.mini-dato span{font-size:.72rem;color:var(--texto2);font-weight:800;text-transform:uppercase;letter-spacing:.4px}

.banner{
  border-radius:var(--radio);padding:14px 18px;margin-bottom:16px;font-weight:800;
  display:flex;align-items:center;gap:10px;font-size:.95rem;
  background:linear-gradient(120deg,var(--acento),var(--acento2));color:#fff;
  box-shadow:0 8px 24px rgba(232,93,74,.35);animation:latido 2.4s ease-in-out infinite;
}
@keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.015)}}
.banner.final{background:linear-gradient(120deg,#6C3FB5,#E85D4A)}

.frase{
  font-family:'Fraunces',serif;font-size:1.12rem;font-weight:700;font-style:italic;
  text-align:center;padding:6px 8px;line-height:1.45;
}
.frase::before{content:'“';color:var(--acento);font-size:1.5rem}
.frase::after{content:'”';color:var(--acento);font-size:1.5rem}

/* ---------- Ranking ---------- */
.fila-rank{
  display:flex;align-items:center;gap:12px;padding:12px 8px;border-radius:16px;
  transition:transform .3s;
}
.fila-rank:not(:last-child){border-bottom:1px dashed var(--linea)}
.medalla{font-size:1.5rem;width:38px;text-align:center;flex-shrink:0}
.avatar{
  width:46px;height:46px;border-radius:50%;object-fit:cover;flex-shrink:0;
  border:3px solid var(--pc,var(--acento));background:var(--pc,var(--acento));
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:1.2rem;overflow:hidden;
}
.avatar img{width:100%;height:100%;object-fit:cover}
.rank-info{flex:1;min-width:0}
.rank-nombre{font-weight:900;font-size:1.02rem}
.rank-detalle{font-size:.78rem;color:var(--texto2);font-weight:700}
.rank-puntos{font-family:'Fraunces',serif;font-weight:900;font-size:1.15rem;text-align:right}
.rank-puntos small{display:block;font-family:'Nunito';font-size:.65rem;color:var(--texto2);font-weight:800}

/* ---------- Botones ---------- */
.btn{
  display:block;width:100%;border:none;border-radius:18px;padding:17px;
  font-family:'Nunito';font-size:1.05rem;font-weight:900;cursor:pointer;
  background:var(--acento);color:#fff;box-shadow:0 6px 18px rgba(232,93,74,.3);
  transition:transform .15s;margin-top:10px;
}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--card);color:var(--texto);border:2px solid var(--linea);box-shadow:none}
.btn.exito{background:var(--exito);box-shadow:0 6px 18px rgba(47,163,124,.3)}
.btn:disabled{opacity:.5}

/* ---------- Registrar ---------- */
.quien{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.persona-card{
  background:var(--card);border-radius:var(--radio);border:2px solid var(--linea);
  padding:20px 12px;text-align:center;cursor:pointer;box-shadow:var(--sombra);
  transition:transform .15s,border-color .15s;
}
.persona-card:active{transform:scale(.95)}
.persona-card .avatar{width:72px;height:72px;margin:0 auto 10px;font-size:1.8rem}
.persona-card b{font-size:1.05rem}
.accion-card{
  display:flex;align-items:center;gap:14px;background:var(--card);border-radius:var(--radio);
  border:1px solid var(--linea);padding:18px;margin-bottom:12px;cursor:pointer;
  box-shadow:var(--sombra);transition:transform .15s;
}
.accion-card:active{transform:scale(.97)}
.accion-icono{font-size:1.9rem;width:52px;height:52px;border-radius:16px;display:flex;
  align-items:center;justify-content:center;background:var(--bg);flex-shrink:0}
.accion-txt{flex:1}
.accion-txt b{display:block;font-size:1.02rem}
.accion-txt span{font-size:.8rem;color:var(--texto2);font-weight:700}
.accion-check{font-size:1.3rem}
.destacada{border:2px solid var(--acento);animation:latido 2.4s ease-in-out infinite}

.toggle-fila{display:flex;align-items:center;justify-content:space-between;padding:14px 4px}
.toggle-fila:not(:last-child){border-bottom:1px dashed var(--linea)}
.toggle-fila label{font-weight:800;font-size:1rem}
.si-no{display:flex;gap:8px}
.si-no button{
  border:2px solid var(--linea);background:var(--card);border-radius:14px;
  padding:10px 20px;font-family:'Nunito';font-weight:900;font-size:.95rem;cursor:pointer;color:var(--texto);
}
.si-no button.on{background:var(--exito);border-color:var(--exito);color:#fff}
.si-no button.on.no{background:var(--texto2);border-color:var(--texto2)}
.animos{display:flex;gap:10px;justify-content:center}
.animos button{
  font-size:1.9rem;background:var(--card);border:2px solid var(--linea);
  border-radius:16px;width:62px;height:62px;cursor:pointer;transition:transform .15s;
}
.animos button.on{border-color:var(--acento);background:var(--bg);transform:scale(1.12)}
input[type=number],input[type=text]{
  width:100%;padding:15px;border-radius:16px;border:2px solid var(--linea);
  background:var(--bg);color:var(--texto);font-family:'Nunito';font-weight:800;
  font-size:1.2rem;text-align:center;margin-top:6px;
}
input:focus{outline:none;border-color:var(--acento)}
.campo{margin-bottom:14px}
.campo>label{font-weight:800;font-size:.85rem;color:var(--texto2)}
.volver{background:none;border:none;color:var(--texto2);font-family:'Nunito';
  font-weight:800;font-size:.9rem;cursor:pointer;padding:6px 0;margin-bottom:8px}

/* ---------- Trofeos ---------- */
.trofeos-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.trofeo{
  background:var(--card);border-radius:18px;border:1px solid var(--linea);
  padding:14px 8px;text-align:center;box-shadow:var(--sombra);
}
.trofeo .ico{font-size:2rem;display:block;margin-bottom:6px}
.trofeo b{font-size:.72rem;display:block;line-height:1.25}
.trofeo span{font-size:.62rem;color:var(--texto2);font-weight:700;display:block;margin-top:3px}
.trofeo.bloqueado{opacity:.35;filter:grayscale(1)}
.trofeo.nuevo{animation:brillo 1.2s ease 3}
@keyframes brillo{0%,100%{box-shadow:var(--sombra)}50%{box-shadow:0 0 24px var(--acento2)}}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;border:2px solid var(--linea);background:var(--card);border-radius:99px;
  padding:9px 18px;font-family:'Nunito';font-weight:900;font-size:.9rem;cursor:pointer;color:var(--texto);
}
.chip.on{background:var(--texto);color:var(--bg);border-color:var(--texto)}

/* ---------- Estadísticas ---------- */
.numeros{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.numero{
  background:var(--bg);border-radius:16px;padding:14px;text-align:center;
}
.numero b{font-family:'Fraunces',serif;font-size:1.5rem;display:block}
.numero span{font-size:.68rem;color:var(--texto2);font-weight:800;text-transform:uppercase;letter-spacing:.4px}
.pista{position:relative;padding:8px 0 8px}
.carril{position:relative;height:56px;margin-bottom:8px;background:var(--bg);border-radius:14px;overflow:hidden}
.carril .meta-linea{position:absolute;right:12px;top:0;bottom:0;display:flex;align-items:center;font-size:1.2rem}
.corredor{
  position:absolute;top:5px;left:0;transition:left 1.4s cubic-bezier(.2,.8,.2,1);
  display:flex;align-items:center;gap:6px;
}
.corredor .avatar{width:46px;height:46px}
.corredor small{font-weight:900;font-size:.75rem;background:var(--card);padding:3px 8px;border-radius:8px;box-shadow:var(--sombra)}
.anillos{display:flex;justify-content:space-around;text-align:center}
.anillo-item span{font-size:.75rem;font-weight:800;display:block;margin-top:4px}
.calendario{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dia{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  background:var(--bg);border-radius:10px;font-size:1.05rem;
}
.cal-dia.vacio{opacity:.25;font-size:.7rem;font-weight:800;color:var(--texto2)}
canvas{max-width:100%}

/* ---------- Navegación ---------- */
nav{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  background:var(--card);border-top:1px solid var(--linea);
  display:flex;justify-content:space-around;padding:8px 6px calc(10px + env(safe-area-inset-bottom));
  box-shadow:0 -6px 24px rgba(42,33,56,.08);
}
nav button{
  background:none;border:none;font-family:'Nunito';cursor:pointer;color:var(--texto2);
  display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:.68rem;font-weight:900;padding:6px 14px;border-radius:14px;
}
nav button .nav-ico{font-size:1.5rem;transition:transform .2s}
nav button.on{color:var(--acento)}
nav button.on .nav-ico{transform:translateY(-3px) scale(1.15)}

/* ---------- Cargando / aviso ---------- */
.cargando{text-align:center;padding:80px 20px}
.cargando .giro{
  width:52px;height:52px;border-radius:50%;margin:0 auto 18px;
  border:5px solid var(--linea);border-top-color:var(--acento);animation:girar 1s linear infinite;
}
@keyframes girar{to{transform:rotate(360deg)}}
.aviso{
  position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:100;
  background:var(--texto);color:var(--bg);padding:13px 22px;border-radius:99px;
  font-weight:900;font-size:.9rem;box-shadow:var(--sombra);white-space:nowrap;
  animation:bajar .35s ease;
}
@keyframes bajar{from{opacity:0;transform:translate(-50%,-16px)}to{opacity:1;transform:translate(-50%,0)}}
.confeti{position:fixed;top:-12px;z-index:99;font-size:1.2rem;animation:caer 2.8s linear forwards;pointer-events:none}
@keyframes caer{to{transform:translateY(110vh) rotate(720deg);opacity:.6}}
.corona-semana{text-align:center;padding:10px 0 4px}
.corona-semana .ico{font-size:2.6rem}
.corona-semana b{display:block;font-family:'Fraunces',serif;font-size:1.3rem;margin-top:4px}

/* ---------- Premios semanales ---------- */
.avatar.mini{width:34px;height:34px;font-size:.95rem;border-width:2px}
.premio-fila{display:flex;align-items:center;gap:11px;padding:11px 2px}
.premio-fila:not(:last-of-type){border-bottom:1px dashed var(--linea)}
.premio-ico{font-size:1.6rem;width:34px;text-align:center;flex-shrink:0}
.premio-txt{flex:1;min-width:0}
.premio-txt b{display:block;font-size:.95rem;font-weight:900}
.premio-txt span{font-size:.72rem;color:var(--texto2);font-weight:700}
.premio-gana{display:flex;gap:8px;flex-shrink:0}
.gana-uno{text-align:center}
.gana-uno small{display:block;font-size:.62rem;font-weight:900;margin-top:2px}
.sem-ranking{margin-top:14px;padding-top:14px;border-top:1px solid var(--linea)}
.sem-fila{display:flex;align-items:center;gap:9px;padding:5px 0}
.sem-pos{font-family:'Fraunces',serif;font-weight:900;width:16px;color:var(--texto2)}
.sem-nom{font-weight:800;font-size:.85rem;width:66px;flex-shrink:0}
.sem-barra{flex:1;height:9px;background:var(--linea);border-radius:99px;overflow:hidden}
.sem-barra i{display:block;height:100%;border-radius:99px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.sem-pts{font-weight:900;font-size:.85rem;width:26px;text-align:right}
.historial{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none}
.historial::-webkit-scrollbar{display:none}
.hist-item{text-align:center;flex-shrink:0}
.hist-item b{display:block;font-size:.72rem;margin-top:3px}
.hist-item span{font-size:.66rem;color:var(--texto2);font-weight:800}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">Transformación <span>70</span></div>
    <button class="tema-btn" id="temaBtn" onclick="cambiarTema()">🌙</button>
  </header>
  <main id="contenido">
    <div class="cargando"><div class="giro"></div><b>Cargando el reto…</b></div>

</div>
<nav id="navBar" style="display:none">
  <button data-v="inicio" class="on" onclick="ir('inicio')"><span class="nav-ico">🏠</span>Inicio</button>

<script>

const API = 'https://script.google.com/macros/s/AKfycby2PXJeYmO5PMbffI35_-hqi6-pYfqtV8-rO1hA06vJxTLwvAyCPFwmt7p2TSx24WZQ5w/exec';

const TROFEOS = [
 {id:'primera_batalla', ico:'⚔️', nombre:'Primera Batalla', desc:'Primer pesaje registrado'},

 {id:'transformacion',  ico:'🦋', nombre:'Transformación Total', desc:'Mayor cambio al final'}
];

let S = null;      // datos crudos del Sheet
let C = null;      // datos calculados
let vista = 'inicio';
let yoId = null;   // participante seleccionada en "Registrar"
let statSel = 0;   // 0 = grupo, o id de participante
let trofeoSel = 1; // participante mostrada en trofeos
let charts = [];

/* -------------------- utilidades -------------------- */
function guardaLocal(k,v){ try{localStorage.setItem(k,v)}catch(e){} }
function leeLocal(k){ try{return localStorage.getItem(k)}catch(e){return null} }
function hoyISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fechaISO(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function num(v){ const n = parseFloat(v); return isNaN(n) ? null : n; }
function esVerdad(v){ return v === true || v === 'TRUE' || v === 'true' || v === 1; }
function fotoURL(link){
  if(!link) return null;
  const m = String(link).match(/[-\w]{25,}/);
  return m ? 'https://drive.google.com/thumbnail?id='+m[0]+'&sz=w200' : null;
}
function avatarHTML(p, extra){

}

async function enviar(accion, datos){
  const r = await fetch(API, { method:'POST', body: JSON.stringify({accion, datos}) });
  const j = await r.json();
  if(!j.ok) throw new Error(j.error||'Error al guardar');
  return j;
}

/* -------------------- cálculos -------------------- */
function calcular(){
  const cfg = {};
  (S.config||[]).forEach(f => cfg[f.clave] = f.valor);
  const inicioStr = String(cfg.fecha_inicio||'2026-07-21').slice(0,10);
  const inicio = new Date(inicioStr+'T00:00:00');
  const total = Number(cfg.dias_totales)||70;
  const hoy = new Date(hoyISO()+'T00:00:00');
  let dia = Math.floor((hoy - inicio)/86400000) + 1;
  const empezo = dia >= 1;
  dia = Math.min(Math.max(dia,1), total);
  const semana = Math.min(Math.ceil(dia/7), 10);
  const esLunes = new Date().getDay() === 1;

  // fecha de cada día del reto
  const fechaDia = d => { const x = new Date(inicio); x.setDate(x.getDate()+d-1); return fechaISO(x); };

  const nombreCol = {1:'carmen',2:'rosa',3:'laly',4:'dany'};
  const P = (S.participantes||[]).map(p => {
    const id = Number(p.id);
    const pes = (S.pesajes||[]).filter(x=>Number(x.participante_id)===id && num(x.peso)!==null)
                 .sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha)));
    const chk = (S.checkins||[]).filter(x=>Number(x.participante_id)===id);
    const chkMap = {}; chk.forEach(c=>chkMap[String(c.fecha).slice(0,10)] = c);

    const pesoIni = num(p.peso_inicial) ?? (pes.length ? num(pes[0].peso) : null);
    const cintIni = num(p.cintura_inicial) ?? (pes.length ? num(pes[0].cintura) : null);
    const ult = pes.length ? pes[pes.length-1] : null;
    const pesoAct = ult ? num(ult.peso) : pesoIni;
    const cintAct = ult && num(ult.cintura)!==null ? num(ult.cintura) : cintIni;
    const pesos = pes.map(x=>num(x.peso)).filter(x=>x!==null);
    const kg = (pesoIni!==null && pesoAct!==null) ? +(pesoIni-pesoAct).toFixed(1) : 0;
    const pct = (pesoIni && kg) ? +(kg/pesoIni*100).toFixed(2) : 0;
    const cm = (cintIni!==null && cintAct!==null) ? +(cintIni-cintAct).toFixed(1) : 0;
    const cmPct = (cintIni && cm) ? +(cm/cintIni*100).toFixed(2) : 0;

    // racha: días consecutivos con check-in terminando hoy o ayer
    let racha = 0;
    { const d = new Date(hoy);
      if(!chkMap[fechaISO(d)]) d.setDate(d.getDate()-1);
      while(chkMap[fechaISO(d)]){ racha++; d.setDate(d.getDate()-1); } }
    // mejor racha de agua consecutiva
    let aguaRacha = 0, aguaMax = 0;
    for(let d=1; d<=dia; d++){
      const c = chkMap[fechaDia(d)];
      if(c && esVerdad(c.agua)){ aguaRacha++; aguaMax = Math.max(aguaMax,aguaRacha); }
      else aguaRacha = 0;
    }
    const retosOK = (S.retos||[]).filter(r=>esVerdad(r[nombreCol[id]])).length;
    const objetivo = num(p.objetivo_kg);

    return { ...p, id, pes, chkMap, pesoIni, cintIni, pesoAct, cintAct,
      kg, pct, cm, cmPct, racha, aguaMax, retosOK, objetivo,
      pesoMin: pesos.length?Math.min(...pesos):null, pesoMax: pesos.length?Math.max(...pesos):null,
      diasReg: Object.keys(chkMap).length };
  });

  // ---- puntos por semana + reinas ----
  const semanas = [];
  for(let w=1; w<=semana; w++){
    const d1 = (w-1)*7+1, d2 = Math.min(w*7, total);
    const fechas = []; for(let d=d1; d<=Math.min(d2, dia); d++) fechas.push(fechaDia(d));
    const pesoW = {}, filas = [];
    P.forEach(p=>{
      const enSem = p.pes.filter(x=>{
        const f = String(x.fecha).slice(0,10);
        return f >= fechaDia(d1) && f <= fechaDia(d2);
      });
      const antes = p.pes.filter(x=>String(x.fecha).slice(0,10) < fechaDia(d1));
      const pAntes = antes.length ? num(antes[antes.length-1].peso) : num(p.peso_inicial);
      const pSem = enSem.length ? num(enSem[enSem.length-1].peso) : null;
      pesoW[p.id] = (pAntes!==null && pSem!==null && pAntes>0) ? Math.max(0,(pAntes-pSem)/pAntes*100) : 0;
    });
    const mejorPeso = Math.max(...Object.values(pesoW), 0.0001);
    P.forEach(p=>{
      const dias = fechas.filter(f=>p.chkMap[f]).length;
      const agua = fechas.filter(f=>p.chkMap[f] && esVerdad(p.chkMap[f].agua)).length;
      const ejer = fechas.filter(f=>p.chkMap[f] && esVerdad(p.chkMap[f].ejercicio)).length;
      const reto = (S.retos||[]).find(r=>Number(r.semana)===w);
      const retoOK = reto ? esVerdad(reto[nombreCol[p.id]]) : false;
      const pts = Math.round(
        (pesoW[p.id]/mejorPeso)*25 + (dias/fechas.length||0)*25 +
        (retoOK?25:0) + (agua/fechas.length||0)*15 + (Math.min(ejer,3)/3)*10 );
      filas.push({id:p.id, pts, retoOK, dias, agua, ejer, pctPeso:+pesoW[p.id].toFixed(2)});
    });
    filas.sort((a,b)=>b.pts-a.pts);
    const terminada = dia > d2;
    // gana quien tenga el valor más alto (puede haber empate)
    const gana = campo => {
      const max = Math.max(...filas.map(f=>f[campo]));
      return max > 0 ? filas.filter(f=>f[campo]===max).map(f=>f.id) : [];
    };
    semanas.push({ w, filas, terminada, d1, d2,
      premios: { corona: gana('pts'), peso: gana('pctPeso'),
                 constancia: gana('dias'), agua: gana('agua') },
      reina: (terminada && filas[0].pts>0) ? filas[0].id : null });
  }
  P.forEach(p=>{
    p.coronas = semanas.filter(s=>s.reina===p.id).length;
    let seg=0, maxSeg=0;
    semanas.forEach(s=>{ if(s.reina===p.id){seg++; maxSeg=Math.max(maxSeg,seg)} else if(s.terminada) seg=0; });
    p.coronasSeguidas = maxSeg;
  });

  // ---- puntos generales ----
  const mejorPct = Math.max(...P.map(p=>p.pct), 0.0001);
  const mejorCm  = Math.max(...P.map(p=>p.cmPct), 0.0001);
  const semTerm  = Math.max(semanas.filter(s=>s.terminada).length, 1);
  P.forEach(p=>{
    p.puntos = Math.round(
      (Math.max(p.pct,0)/mejorPct)*35 + (Math.max(p.cmPct,0)/mejorCm)*25 +
      (p.diasReg/Math.max(dia,1))*20 + (p.retosOK/Math.max(semana,1))*10 +
      (p.coronas/semTerm)*10 );
  });
  const ranking = [...P].sort((a,b)=>b.puntos-a.puntos || b.pct-a.pct);

  const retoActual = (S.retos||[]).find(r=>Number(r.semana)===semana);
  C = { cfg, inicio, inicioStr, total, dia, semana, esLunes, empezo, fechaDia,
        P, ranking, semanas, retoActual, nombreCol,
        restantes: total-dia,
        frase: FRASES[(dia-1) % FRASES.length],
        kgGrupo: +P.reduce((s,p)=>s+Math.max(p.kg,0),0).toFixed(1),
        cmGrupo: +P.reduce((s,p)=>s+Math.max(p.cm,0),0).toFixed(1) };
}

/* -------------------- trofeos -------------------- */
function trofeosDe(p){
  const fin = C.dia >= C.total;
  const lunesPasados = [];
  for(let d=1; d<=C.dia; d++){
    const f = new Date(C.fechaDia(d)+'T00:00:00');
    if(f.getDay()===1 || d===1) lunesPasados.push(C.fechaDia(d));
  }
  const pesoTodosLunes = lunesPasados.length>=3 && lunesPasados.every(f=>
    p.pes.some(x=>{
      const pf = String(x.fecha).slice(0,10);
      return Math.abs((new Date(pf)-new Date(f))/86400000) <= 1;
    }));
  const mejor = C.ranking[0];
  const cond = {
    primera_batalla: p.pes.length>0,
    primer_kilo: p.kg>=1, tres_kilos: p.kg>=3, cinco_kilos: p.kg>=5,
    cintura_acero: p.cm>=3,
    racha_7: p.racha>=7 || p.diasReg>=7 && p.racha>=7,
    racha_21: p.racha>=21, racha_50: p.racha>=50,
    guerrera_agua: p.aguaMax>=14,
    reina: p.coronas>=1, doble_corona: p.coronas>=2, imbatible: p.coronasSeguidas>=3,
    constancia: pesoTodosLunes,
    retadora: p.retosOK>=5, completa: p.retosOK>=10,
    transformacion: fin && mejor.id===p.id && p.pct>0
  };
  return TROFEOS.map(t=>({...t, ok: !!cond[t.id]}));
}
// Cuando se cierra una semana, celebra a la nueva reina una sola vez
function celebrarReina(){
  const ultima = C.semanas.filter(s=>s.reina).pop();
  if(!ultima) return;
  if(leeLocal('t70_reina') === String(ultima.w)) return;
  guardaLocal('t70_reina', String(ultima.w));
  const rp = C.P.find(p=>p.id===ultima.reina);
  setTimeout(()=>{ confeti(); aviso('👑 ¡'+rp.nombre+' es la Reina de la semana '+ultima.w+'!'); }, 700);
}

async function detectarTrofeosNuevos(){
  const guardados = new Set((S.trofeos||[]).map(t=>Number(t.participante_id)+'_'+t.trofeo));
  const nuevos = [];
  C.P.forEach(p=>{
    trofeosDe(p).forEach(t=>{
      if(t.ok && !guardados.has(p.id+'_'+t.id)) nuevos.push({p, t});
    });
  });
  for(const n of nuevos){
    try{
      await enviar('trofeo', {participante_id:n.p.id, trofeo:n.t.id, fecha:hoyISO()});
      S.trofeos.push({participante_id:n.p.id, trofeo:n.t.id, fecha:hoyISO()});
    }catch(e){}
  }
  if(nuevos.length){
    confeti();
    aviso('🏆 ¡'+nuevos[0].p.nombre+' desbloqueó "'+nuevos[0].t.nombre+'"!');
  }
}

function tarjetaPremios(){
  const s = C.semanas[C.semanas.length-1];
  if(!s) return '';
  const buscar = ids => ids.length ? ids.map(i=>C.P.find(p=>p.id===i)) : null;
  const lista = [
    {ico:'👑', t:'Reina de la Semana', d:'más puntos en total',     g:s.premios.corona},
    {ico:'⚖️', t:'Mejor Pesaje',       d:'más peso perdido',        g:s.premios.peso},
    {ico:'🔥', t:'La Más Constante',   d:'más días registrados',    g:s.premios.constancia},
    {ico:'💧', t:'Guerrera del Agua',  d:'más días bebiendo agua',  g:s.premios.agua}
  ];
  let h = `<div class="card"><h2>🏅 Premios de la semana ${s.w}</h2>
    <p class="sub" style="margin-bottom:10px">${s.terminada
      ? 'Semana cerrada · ¡estas fueron las ganadoras!'
      : 'En directo · la semana se cierra el domingo por la noche'}</p>`;
  lista.forEach(pr=>{
    const gs = buscar(pr.g);
    h += `<div class="premio-fila">
      <div class="premio-ico">${pr.ico}</div>
      <div class="premio-txt"><b>${pr.t}</b><span>${pr.d}</span></div>
      <div class="premio-gana">${ gs
        ? gs.map(p=>'<div class="gana-uno">'+avatarHTML(p,'mini')+'<small>'+p.nombre+'</small></div>').join('')
        : '<small class="sub">aún nadie</small>' }</div></div>`;
  });
  h += '<div class="sem-ranking"><div class="sub" style="margin-bottom:8px">Puntos de esta semana</div>';
  const max = Math.max(s.filas[0].pts, 1);
  s.filas.forEach((f,i)=>{
    const p = C.P.find(x=>x.id===f.id);
    h += `<div class="sem-fila"><span class="sem-pos">${i+1}</span>
      <span class="sem-nom">${p.nombre}</span>
      <span class="sem-barra"><i data-anim data-w="${(f.pts/max*100).toFixed(0)}%" style="width:0;background:${p.color}"></i></span>
      <span class="sem-pts">${f.pts}</span></div>`;
  });
  return h + '</div></div>';
}

    <div class="toggle-fila"><label>💧 ¿Bebiste agua suficiente?</label>
      <div class="si-no">
        <button class="${F.agua===true?'on':''}" onclick="F.agua=true;pintarChk()">Sí</button>
        <button class="${F.agua===false?'on no':''}" onclick="F.agua=false;pintarChk()">No</button>
      </div></div>
    <div class="toggle-fila"><label>👟 ¿Hiciste ejercicio?</label>
      <div class="si-no">
        <button class="${F.ejercicio===true?'on':''}" onclick="F.ejercicio=true;pintarChk()">Sí</button>
        <button class="${F.ejercicio===false?'on no':''}" onclick="F.ejercicio=false;pintarChk()">No</button>
      </div></div>
    <div class="toggle-fila" style="display:block"><label>¿Cómo te sientes hoy?</label>
      <div class="animos" style="margin-top:10px">
        ${['😊','😐','😔'].map(e=>`<button class="${F.animo===e?'on':''}" onclick="F.animo='${e}';pintarChk()">${e}</button>`).join('')}
      </div></div>
    <button class="btn" id="btnG" onclick="guardarChk()" ${(F.agua===null||F.ejercicio===null||!F.animo)?'disabled':''}>Guardar mi día</button>
  </div>`;
  document.getElementById('formZona').scrollIntoView({behavior:'smooth'});
}
async function guardarChk(){
  const b = document.getElementById('btnG'); b.disabled = true; b.textContent = 'Guardando…';
  try{
    await enviar('checkin', {fecha:hoyISO(), participante_id:yoId, agua:F.agua, ejercicio:F.ejercicio, animo:F.animo});
    aviso('✅ ¡Día registrado! Sumaste puntos.');
    await cargar(); ir('registrar');
  }catch(e){ aviso('😕 Error al guardar, inténtalo de nuevo'); b.disabled=false; b.textContent='Guardar mi día'; }
}

function formPesaje(){
  const p = C.P.find(x=>x.id===yoId);
  const hoyP = p.pes.find(x=>String(x.fecha).slice(0,10)===hoyISO());
  document.getElementById('formZona').innerHTML = `<div class="card"><h2>⚖️ Pesaje de hoy</h2>
    <div class="campo"><label>Peso (kg) — ej: 72.5</label>
      <input type="number" step="0.1" inputmode="decimal" id="inPeso" value="${hoyP?num(hoyP.peso)??'':''}"></div>
    <div class="campo"><label>Cintura (cm) — ej: 94</label>
      <input type="number" step="0.5" inputmode="decimal" id="inCint" value="${hoyP?num(hoyP.cintura)??'':''}"></div>
    <button class="btn" id="btnG" onclick="guardarPesaje()">Guardar pesaje</button>
    ${p.pesoAct!==null && !hoyP ? '<p class="sub" style="text-align:center;margin-top:10px">Tu último peso: '+p.pesoAct+' kg</p>':''}
  </div>`;
  document.getElementById('formZona').scrollIntoView({behavior:'smooth'});
}
async function guardarPesaje(){
  const peso = num(document.getElementById('inPeso').value);
  const cint = num(document.getElementById('inCint').value);
  if(peso===null || peso<30 || peso>250) return aviso('Escribe un peso válido');
  if(cint===null || cint<40 || cint>200) return aviso('Escribe una cintura válida');
  const b = document.getElementById('btnG'); b.disabled = true; b.textContent = 'Guardando…';
  try{
    await enviar('pesaje', {fecha:hoyISO(), participante_id:yoId, peso, cintura:cint});
    const p = C.P.find(x=>x.id===yoId);
    if(p.pesoIni===null || !num(p.peso_inicial))
      await enviar('perfil', {id:yoId, peso_inicial:peso, cintura_inicial:cint});
    confeti(); aviso('⚖️ ¡Pesaje guardado!');
    await cargar(); ir('registrar');
  }catch(e){ aviso('😕 Error al guardar'); b.disabled=false; b.textContent='Guardar pesaje'; }
}

  document.getElementById('formZona').innerHTML = `<div class="card"><h2>🎯 Reto de la semana ${C.semana}</h2>
    <p style="font-weight:800;font-size:1.05rem;margin-bottom:6px">${C.retoActual.descripcion}</p>

         : '<p class="sub">Cuando lo hayas cumplido, márcalo aquí. Vale 25 puntos.</p><button class="btn exito" id="btnG" onclick="guardarReto()">✔️ ¡Lo cumplí!</button>'}
  </div>`;

}
async function guardarReto(){

function formPerfil(){
  const p = C.P.find(x=>x.id===yoId);
  document.getElementById('formZona').innerHTML = `<div class="card"><h2>👤 Mi perfil</h2>
    <div class="campo"><label>Edad</label><input type="number" id="inEdad" inputmode="numeric" value="${p.edad||''}"></div>
    <div class="campo"><label>Estatura (cm) — ej: 158</label><input type="number" id="inEst" inputmode="numeric" value="${p.estatura||''}"></div>
    <div class="campo"><label>¿Cuántos kg quieres perder en el reto?</label><input type="number" step="0.5" id="inObj" inputmode="decimal" value="${p.objetivo||''}"></div>

/* -------------------- VISTA: Trofeos -------------------- */
function vTrofeos(){
  let h = '<div class="chips">';
  C.P.forEach(p=>{ h += `<button class="chip ${trofeoSel===p.id?'on':''}" onclick="trofeoSel=${p.id};render()">${p.nombre}</button>`; });
  h += '</div>';
  const p = C.P.find(x=>x.id===trofeoSel);
  const ts = trofeosDe(p);
  const n = ts.filter(t=>t.ok).length;
  h += `<div class="card" style="display:flex;align-items:center;gap:14px">
    ${avatarHTML(p)}
    <div><b style="font-size:1.15rem">${p.nombre}</b>
    <div class="sub">${n} de ${ts.length} trofeos · ${'👑'.repeat(p.coronas)||'aún sin coronas'}</div></div></div>`;
  h += '<div class="trofeos-grid">';
  ts.forEach(t=>{
    h += `<div class="trofeo ${t.ok?'':'bloqueado'}">
      <span class="ico">${t.ok?t.ico:'🔒'}</span><b>${t.nombre}</b><span>${t.desc}</span></div>`;
  });
  return h+'</div>';
}

/* -------------------- VISTA: Estadísticas -------------------- */
function vStats(){
  let h = '<div class="chips">';
  h += `<button class="chip ${statSel===0?'on':''}" onclick="statSel=0;render()">👯 El grupo</button>`;
  C.P.forEach(p=>{ h += `<button class="chip ${statSel===p.id?'on':''}" onclick="statSel=${p.id};render()">${p.nombre}</button>`; });
  h += '</div>';
  return h + (statSel===0 ? vStatsGrupo() : vStatsInd());
}
function vStatsGrupo(){
  const lider = C.ranking[0];
  const masConstante = [...C.P].sort((a,b)=>b.diasReg-a.diasReg)[0];
  const mejorCint = [...C.P].sort((a,b)=>b.cm-a.cm)[0];
  let h = `<div class="card"><h2>👯 El grupo</h2><div class="numeros">
    <div class="numero"><b>${C.kgGrupo}</b><span>kg perdidos juntas</span></div>
    <div class="numero"><b>${C.cmGrupo}</b><span>cm de cintura</span></div>
    <div class="numero"><b>${lider.nombre}</b><span>🏆 líder actual</span></div>
    <div class="numero"><b>${masConstante.nombre}</b><span>❤️ más constante</span></div>
    <div class="numero"><b>${mejorCint.nombre}</b><span>📏 más cintura perdida</span></div>
    <div class="numero"><b>${C.P.reduce((s,p)=>s+p.diasReg,0)}</b><span>registros totales</span></div>
  </div></div>`;

  // Carrera hacia la meta
  h += '<div class="card"><h2>🏁 La carrera</h2><p class="sub" style="margin-bottom:10px">Avance hacia el objetivo de cada una</p><div class="pista">';
  C.P.forEach(p=>{
    const meta = p.objetivo || 5;
    const avance = Math.min(Math.max(p.kg,0)/meta*100, 100);
    h += `<div class="carril"><div class="meta-linea">🏁</div>
      <div class="corredor" data-anim data-l="${(avance*0.78).toFixed(1)}%" style="left:0">
        ${avatarHTML(p)}<small>${p.kg>0?'−'+p.kg+' kg':'—'}</small></div></div>`;
  });
  h += '</div></div>';

  // Anillos de constancia (semana actual)
  h += '<div class="card"><h2>💍 Constancia esta semana</h2><div class="anillos">';
  const d1 = (C.semana-1)*7+1;
  C.P.forEach(p=>{
    let hechos = 0, posibles = 0;
    for(let d=d1; d<=Math.min(C.semana*7, C.dia); d++){ posibles++; if(p.chkMap[C.fechaDia(d)]) hechos++; }
    const pctA = posibles ? hechos/7 : 0;
    const r = 26, circ = 2*Math.PI*r;
    h += `<div class="anillo-item">
      <svg width="70" height="70" viewBox="0 0 70 70">
        <circle cx="35" cy="35" r="${r}" fill="none" stroke="var(--linea)" stroke-width="8"/>
        <circle cx="35" cy="35" r="${r}" fill="none" stroke="${p.color}" stroke-width="8"
          stroke-linecap="round" stroke-dasharray="${(pctA*circ).toFixed(1)} ${circ}"
          transform="rotate(-90 35 35)" style="transition:stroke-dasharray 1.2s"/>
        <text x="35" y="40" text-anchor="middle" font-size="15" font-weight="900" fill="var(--texto)">${hechos}/7</text>
      </svg><span>${p.nombre}</span></div>`;
  });
  h += '</div></div>';

  h += '<div class="card"><h2>📉 Evolución comparada</h2><p class="sub" style="margin-bottom:8px">% de peso perdido</p><canvas id="chGrupo" height="220"></canvas></div>';
  h += `<div class="card"><h2>📲 Resumen para WhatsApp</h2>
    <p class="sub" style="margin-bottom:6px">Copia el resumen y pégalo en el grupo</p>
    <button class="btn sec" onclick="copiarResumen()">📋 Copiar resumen</button></div>`;
  return h;
}
function vStatsInd(){
  const p = C.P.find(x=>x.id===statSel);
  const meta = p.objetivo || null;
  const avanceMeta = meta && p.kg>0 ? Math.min(p.kg/meta*100,100).toFixed(0) : null;
  let h = `<div class="card" style="display:flex;align-items:center;gap:14px">
    ${avatarHTML(p)}
    <div><b style="font-size:1.2rem">${p.nombre}</b>
    <div class="sub">${p.edad?p.edad+' años · ':''}${p.estatura?p.estatura+' cm · ':''}${p.puntos} puntos</div></div></div>`;
  h += `<div class="card"><div class="numeros">
    <div class="numero"><b>${p.pesoIni??'—'}</b><span>peso inicial</span></div>
    <div class="numero"><b>${p.pesoAct??'—'}</b><span>peso actual</span></div>
    <div class="numero"><b style="color:var(--exito)">−${p.kg}</b><span>kg perdidos</span></div>
    <div class="numero"><b style="color:var(--exito)">${p.pct}%</b><span>de su peso</span></div>
    <div class="numero"><b>${p.cintIni??'—'} → ${p.cintAct??'—'}</b><span>cintura (cm)</span></div>
    <div class="numero"><b style="color:var(--exito)">−${p.cm} cm</b><span>de cintura</span></div>
    <div class="numero"><b>🔥 ${p.racha}</b><span>racha actual</span></div>
    <div class="numero"><b>${p.diasReg}</b><span>días registrados</span></div>
    <div class="numero"><b>${p.retosOK}/10</b><span>retos cumplidos</span></div>
    <div class="numero"><b>${'👑'.repeat(p.coronas)||'—'}</b><span>coronas</span></div>
  </div>`;
  if(avanceMeta){
    h += `<div style="margin-top:14px"><div class="sub">Meta: perder ${meta} kg · vas al ${avanceMeta}%</div>
    <div class="barra-fondo"><div class="barra-relleno" data-w="${avanceMeta}%" style="width:0"></div></div></div>`;
  }
  h += '</div>';
  h += '<div class="card"><h2>📉 Su peso</h2><canvas id="chPeso" height="210"></canvas></div>';
  h += '<div class="card"><h2>📏 Su cintura</h2><canvas id="chCint" height="200"></canvas></div>';

  // calendario de ánimo
  h += '<div class="card"><h2>🗓️ Su ánimo día a día</h2><div class="calendario">';
  for(let d=1; d<=C.total; d++){
    const c = p.chkMap[C.fechaDia(d)];
    if(d>C.dia) h += '<div class="cal-dia vacio">'+d+'</div>';
    else h += '<div class="cal-dia'+(c?'':' vacio')+'">'+(c ? (c.animo||'✅') : d)+'</div>';
  }
  h += '</div></div>';
  return h;
}
function pintarCharts(){
  const estilo = getComputedStyle(document.documentElement);
  const txt = estilo.getPropertyValue('--texto2').trim();
  const linea = estilo.getPropertyValue('--linea').trim();
  Chart.defaults.font.family = 'Nunito';
  Chart.defaults.color = txt;
  const ops = {responsive:true, plugins:{legend:{labels:{font:{weight:800}}}},
    scales:{x:{grid:{color:linea}}, y:{grid:{color:linea}}}};

  const g = document.getElementById('chGrupo');
  if(g){
    const labels = []; for(let w=1; w<=C.semana; w++) labels.push('S'+w);
    const datasets = C.P.map(p=>{
      const data = [];
      for(let w=1; w<=C.semana; w++){
        const hasta = C.fechaDia(Math.min(w*7, C.dia));
        const pes = p.pes.filter(x=>String(x.fecha).slice(0,10)<=hasta);
        const ultimo = pes.length ? num(pes[pes.length-1].peso) : null;
        data.push(p.pesoIni && ultimo!==null ? +((p.pesoIni-ultimo)/p.pesoIni*100).toFixed(2) : null);
      }
      return {label:p.nombre, data, borderColor:p.color, backgroundColor:p.color,
        tension:.35, borderWidth:3, pointRadius:4};
    });
    charts.push(new Chart(g, {type:'line', data:{labels, datasets}, options:ops}));
  }
  const p = C.P.find(x=>x.id===statSel);
  const cp = document.getElementById('chPeso');
  if(cp && p){
    const labels = p.pes.map(x=>String(x.fecha).slice(5,10).replace('-','/'));
    charts.push(new Chart(cp, {type:'line',
      data:{labels, datasets:[{label:'Peso (kg)', data:p.pes.map(x=>num(x.peso)),
        borderColor:p.color, backgroundColor:p.color+'33', fill:true, tension:.35, borderWidth:3, pointRadius:4}]},
      options:{...ops, plugins:{legend:{display:false}}}}));
  }
  const cc = document.getElementById('chCint');
  if(cc && p){
    const conCint = p.pes.filter(x=>num(x.cintura)!==null);
    charts.push(new Chart(cc, {type:'line',
      data:{labels:conCint.map(x=>String(x.fecha).slice(5,10).replace('-','/')),
        datasets:[{label:'Cintura (cm)', data:conCint.map(x=>num(x.cintura)),
        borderColor:'#6C3FB5', backgroundColor:'#6C3FB533', fill:true, tension:.35, borderWidth:3, pointRadius:4}]},
      options:{...ops, plugins:{legend:{display:false}}}}));
  }
}
function copiarResumen(){
  const m = ['🥇','🥈','🥉','4️⃣'];
  let t = '📊 *Transformación 70 — Semana '+C.semana+' (Día '+C.dia+')*\n';
  const reinaSem = C.semanas.filter(s=>s.reina).pop();
  if(reinaSem) t += '👑 Reina de la semana: '+C.P.find(p=>p.id===reinaSem.reina).nombre+'\n';
  C.ranking.forEach((p,i)=>{ t += m[i]+' '+p.nombre+' — '+p.puntos+' pts (−'+p.kg+' kg)\n'; });
  t += '💪 Juntas: −'+C.kgGrupo+' kg y −'+C.cmGrupo+' cm de cintura\n';
  if(C.retoActual) t += '🎯 Reto: '+C.retoActual.descripcion+'\n';
  t += '🔗 '+location.href;
  navigator.clipboard.writeText(t).then(()=>aviso('📋 ¡Copiado! Pégalo en WhatsApp'))
    .catch(()=>{ prompt('Copia este texto:', t); });
}

</script>
